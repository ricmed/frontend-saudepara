# Configuração para Deploy no Portainer
# Stack Template para SPA Saúde Pará

services:
  spa-saudepara:
    image: ghcr.io/nivspa/frontend-saudepara:latest
    container_name: spa-saudepara-prod
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # === Configurações de Proxy ===
      - NGINX_PROXY_BACKEND=yes
      - NGINX_PROXY_URL=http://backend-saudepara:3000
      - API_AUTH_URL=http://172.32.1.98:4000
      
      # === Configurações de Debug ===
      - DEBUG=false
      - NODE_ENV=production
      
      # === Variáveis do Frontend (Vite) ===
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
      - VITE_API_SERVER=${VITE_API_SERVER}
      - VITE_API_PORT=${VITE_API_PORT}
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spa-saudepara.rule=Host(`app.saude.pa.gov.br`)"
      - "traefik.http.routers.spa-saudepara.entrypoints=websecure"
      - "traefik.http.routers.spa-saudepara.tls.certresolver=letsencrypt"
      - "traefik.http.services.spa-saudepara.loadbalancer.server.port=80"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - saudepara-network

  # Container opcional para desenvolvimento/teste
  spa-saudepara-dev:
    image: ghcr.io/nivspa/frontend-saudepara:latest
    container_name: spa-saudepara-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NGINX_PROXY_BACKEND=no
      - API_AUTH_URL=http://172.32.1.98:4000
      - DEBUG=true
      - NODE_ENV=development
    profiles:
      - dev
    networks:
      - saudepara-network

networks:
  saudepara-network:
    external: true
    # Se a rede não existir, descomente a linha abaixo:
    # driver: bridge