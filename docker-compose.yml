services:
  spa:
    build:
      context: .
      dockerfile: Dockerfile.github
      args:
        VITE_API_SERVER: https://app-api.saude.pa.gov.br
        VITE_API_PORT: 443
        NODE_ENV: production
    ports:
      - "1001:80"
    container_name: spa-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
      - NGINX_PROXY_BACKEND=yes
      - NGINX_PROXY_URL=https://app-api.saude.pa.gov.br:443
      - API_AUTH_URL=http://172.32.1.98:4000
      - DEBUG=true
      - VITE_API_SERVER=https://app-api.saude.pa.gov.br
      - VITE_API_PORT=443
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spa.rule=Host(`localhost`)"
      - "traefik.http.services.spa.loadbalancer.server.port=80"

  # Configuração SPA com proxy habilitado (quando backend estiver disponível)
  spa-with-proxy:
    build:
      context: .
      dockerfile: Dockerfile.github
    ports:
      - "8080:80"
    container_name: spa-with-proxy
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NGINX_PROXY_BACKEND=yes
      - NGINX_PROXY_URL=http://backend:3000
      - API_AUTH_URL=http://172.32.1.98:4000
      - DEBUG=false
    depends_on:
      - backend
    profiles:
      - with-backend

  # Configuração opcional de backend para testes
  backend:
    image: node:18-alpine
    container_name: spa-backend-mock
    ports:
      - "3000:3000"
    command: >
      sh -c "
        echo 'const express = require(\"express\"); 
        const app = express(); 
        app.get(\"/api/health\", (req, res) => res.json({status: \"ok\"})); 
        app.listen(3000, () => console.log(\"Backend mock na porta 3000\"));' > server.js &&
        npm init -y &&
        npm install express &&
        node server.js
      "
    profiles:
      - with-backend

  # Serviço opcional para desenvolvimento com hot reload
  spa-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    container_name: spa-dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev