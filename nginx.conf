# Load balancer upstream para backends
upstream backend_servers {
    server 10.0.2.3:3000;
    server 10.0.2.4:3000;
    server 10.0.2.5:3000;
    server 10.0.2.7:3000;
    server 10.0.2.8:3000;
    server 10.0.2.9:3000;
}

# Redirecionar HTTP para HTTPS
server {
    listen 80;
    server_name app.hml.saude.pa.gov.br;
    return 301 https://$server_name$request_uri;
}

# Configuração principal HTTPS
server {
    listen 443 ssl http2;
    server_name app.hml.saude.pa.gov.br;

    # Configurações SSL (ajustar caminhos conforme necessário)
    ssl_certificate /etc/ssl/certs/app.hml.saude.pa.gov.br.crt;
    ssl_certificate_key /etc/ssl/private/app.hml.saude.pa.gov.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Configuração para preservar cookies em todas as rotas
    proxy_cookie_domain ~\.?(.+) $1;
    proxy_cookie_path / /;

    # Encaminhar /api-auth/ para o serviço Keycloak
    location /api-auth/ {
        proxy_pass http://172.32.1.98:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Preservar cookies para domínio unificado
        proxy_cookie_domain 172.32.1.98:4000 $host;
        proxy_cookie_domain localhost $host;
        proxy_cookie_flags ~ secure samesite=lax;
    }

    # Encaminhar /api/ para o backend Node.js
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Preservar cookies para domínio unificado
        proxy_cookie_domain backend_servers $host;
        proxy_cookie_domain localhost $host;
        proxy_cookie_flags ~ secure samesite=lax;
    }

    # Servir aplicação frontend (arquivos estáticos React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache para arquivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # No cache para index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
