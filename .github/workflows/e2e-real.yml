name: E2E Real (deployed envs)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Qual ambiente rodar"
        required: true
        type: choice
        options:
          - homologacao
          - treinamento
          - producao

jobs:
  e2e-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run E2E REAL (homologacao)
        if: ${{ inputs.environment == 'homologacao' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.HML_BASE_URL }}
          E2E_REAL_FORMS: '1'
          E2E_ADMIN_USERNAME: ${{ secrets.HML_E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.HML_E2E_ADMIN_PASSWORD }}
        run: npx playwright test e2e/dynamic-forms-real-flow.spec.ts

      - name: Run E2E REAL (treinamento)
        if: ${{ inputs.environment == 'treinamento' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.TRN_BASE_URL }}
          E2E_REAL_FORMS: '1'
          E2E_ADMIN_USERNAME: ${{ secrets.TRN_E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.TRN_E2E_ADMIN_PASSWORD }}
        run: npx playwright test e2e/dynamic-forms-real-flow.spec.ts

      - name: Run PRODUCTION smoke (read-only)
        if: ${{ inputs.environment == 'producao' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PRD_BASE_URL }}
        run: npx playwright test e2e/smoke.spec.ts

