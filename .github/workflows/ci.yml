name: CI

on:
  push:
    branches: [main, master, develop, producao]
  pull_request:
    branches: [main, master, develop, producao]
  workflow_dispatch:

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit

      # Garante que o bundle de produção (app.saude.pa.gov.br) compila — evita deploy com HML embutido por engano
      - name: Build produção (Vite mode producao)
        run: npm run build:producao

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright — toda a pasta e2e/; notification-flow opcional com secrets)
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright artifacts (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-ci
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
