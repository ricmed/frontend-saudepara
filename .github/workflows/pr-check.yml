name: PR Build Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production

    - name: Test build output
      run: |
        if [ ! -f "dist/index.html" ]; then
          echo "Build failed: index.html not found in dist/"
          exit 1
        fi
        echo "Build successful: dist/index.html exists"
        
    - name: Build Docker image (test only)
      run: |
        docker build -f Dockerfile.github -t spa-test:latest .
        echo "Docker build successful"