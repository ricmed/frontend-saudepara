server {
    listen 80;
    server_name _;

    # Limite de tamanho para upload de arquivos
    client_max_body_size 50M;

    # =========================================================================
    # Proxy reverso para o backend usando a variável de ambiente BACKEND_URL
    # (renderizada no startup via envsubst do nginx:alpine).
    #
    # IMPORTANTE: defina BACKEND_URL SEM barra "/" no final, ex.:
    #   - Rede interna Coolify: http://saudepara_backend:3000
    #   - URL HTTPS do backend: https://api.seudominio.com
    # =========================================================================

    location /api-auth/ {
        rewrite ^/api-auth/auth/(.*)$ /api/auth/$1 break;
        rewrite ^/api-auth/protected/profile$ /api/auth/profile break;
        rewrite ^/api-auth/admin/(.*)$ /api/auth/admin/$1 break;

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Servir aplicação frontend (arquivos estáticos React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache longo e imutável para assets estáticos com hash
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Sem cache para index.html (garante atualização de novos deploys)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Health check endpoint para Coolify / Traefik
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
