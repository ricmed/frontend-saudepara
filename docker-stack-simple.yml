version: '3.8'

services:
  frontend-saudepara:
    image: ghcr.io/nivspa/frontend-saudepara:latest
    ports:
      - "1001:80"
    environment:
      - NGINX_PROXY_BACKEND=yes
      - NGINX_PROXY_URL=https://app-api.saude.pa.gov.br
      - NGINX_PROXY_PATH=/api
      - NGINX_SERVER_NAME=_
      - NGINX_CLIENT_MAX_BODY_SIZE=100M
      - NGINX_PROXY_READ_TIMEOUT=300s
      - NGINX_PROXY_CONNECT_TIMEOUT=300s
      - VITE_API_SERVER=app-api.saude.pa.gov.br
      - VITE_API_PORT=443
    
    networks:
      - frontend-network
    
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
      
      # Labels para Traefik (se estiver usando)
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend-saudepara.rule=Host(`saudepara.local`) || PathPrefix(`/saudepara`)"
        - "traefik.http.services.frontend-saudepara.loadbalancer.server.port=80"
        - "traefik.docker.network=frontend-network"

networks:
  frontend-network:
    driver: overlay
    attachable: true