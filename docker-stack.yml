version: '3.8'

services:
  frontend-saudepara:
    image: ghcr.io/nivspa/frontend-saudepara:latest
    ports:
      - "1001:80"
    environment:
      # Configurações do nginx proxy
      - NGINX_PROXY_BACKEND=yes
      - NGINX_PROXY_URL=https://app-api.saude.pa.gov.br
      - NGINX_PROXY_PATH=/api
      - NGINX_SERVER_NAME=localhost
      - NGINX_CLIENT_MAX_BODY_SIZE=100M
      - NGINX_PROXY_READ_TIMEOUT=300s
      - NGINX_PROXY_CONNECT_TIMEOUT=300s
      
      # Build-time environment variables (se necessário rebuildar)
      - VITE_API_SERVER=app-api.saude.pa.gov.br
      - VITE_API_PORT=443
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
    
    networks:
      - frontend-network
    
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  frontend-network:
    driver: overlay
    attachable: true